# Sanitized template: supply your own tunnel ID, credentials path, and hostnames locally.
tunnel: YOUR_TUNNEL_ID
credentials-file: C:\Users\YOUR_USERNAME\.cloudflared\YOUR_TUNNEL_ID.json

ingress:
  - hostname: api.feel-y.com
    service: http://127.0.0.1:8000
  - hostname: app.feel-y.com
    service: http://127.0.0.1:5500
  - hostname: dev.feel-y.com
    service: http://127.0.0.1:5501
  - service: http_status:404
